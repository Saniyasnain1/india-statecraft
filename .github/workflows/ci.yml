name: CI Checks & Deployment Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build shared-types
        run: npm run build --workspace=packages/shared-types

      - name: Build game-data
        run: npm run build --workspace=packages/game-data

      - name: Build map-data
        run: npm run build --workspace=packages/map-data

      - name: Build simulation
        run: npm run build --workspace=packages/simulation

      - name: Build Web Application
        run: npm run build --workspace=apps/web

      - name: Run Automated Tests
        run: npm test
